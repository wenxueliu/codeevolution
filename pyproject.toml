[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codehistory"
version = "0.1.0"
description = "Git history-based codebase feature evolution analysis"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "harness" },
]
dependencies = [
    "mcp>=1.0.0,<2",
    "fastmcp>=3.2.4,<4",
    "tree-sitter>=0.23.0,<1",
    "tree-sitter-language-pack>=0.3.0,<1",
    "networkx>=3.2,<4",
    "fastapi>=0.100,<1",
    "uvicorn>=0.20,<1",
]

[project.scripts]
codehistory = "codehistory.cli:main"

[project.optional-dependencies]
llm = [
    "litellm>=1.0,<2",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.3.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["codehistory"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
